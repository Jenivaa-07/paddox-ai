services:
  - type: web
    name: paddox-ai
    env: docker
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: ARTIFACT_BUCKET_URL
        sync: false
      - key: EXPECTED_RF_SHA256
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_SERVICE_KEY
        sync: false
      - key: RAG_MIN_RELEVANCE
        value: "0.28"
      - key: REQUIRE_PREDICTIVE_MODELS
        value: "false"
      - key: FANTASY_RUNTIME_BOOTSTRAP
        value: "true"
      - key: FANTASY_BOOTSTRAP_SEASONS
        value: "2022,2023,2024,2025,2026"
      - key: JOLPICA_USER_AGENT
        value: "PADDOX-AI/1.0 FastF1/3.3.2"
      - key: EXPECTED_LSTM_SHA256
        sync: false
