services:
  - type: web
    name: paddox-ai
    env: docker
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: ARTIFACT_BUCKET_URL
        sync: false
      - key: EXPECTED_RF_SHA256
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_SERVICE_KEY
        sync: false
      - key: RAG_MIN_RELEVANCE
        value: "0.28"
      - key: REQUIRE_PREDICTIVE_MODELS
        value: "false"
      - key: EXPECTED_LSTM_SHA256
        sync: false
